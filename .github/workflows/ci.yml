# CI: version → toolchain image (built by toolchain.yml) → build (static Linux x86_64/aarch64 and
# Windows in the image, macOS natively) → tests (e2e golden tests natively on every OS, ASan/UBSan,
# fuzzing) → docker image FROM scratch of the tested Linux binaries → release of the tested binaries
# and the image (push to main only).
#
# Version = latest vX.Y.Z tag + bump based on conventional commits since that tag:
#   `type!:` / `BREAKING CHANGE:` → major (minor before 1.0), `feat:` → minor, anything else → patch.
# No tags yet → v0.1.0. Pull requests get a -g<sha> suffix.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags
          persist-credentials: false
      - id: version
        shell: bash
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          semver_re='^v([0-9]+)\.([0-9]+)\.([0-9]+)$'
          glob='v[0-9]*.[0-9]*.[0-9]*'

          # Re-run of an already released commit: keep its version.
          version="$(git tag --points-at HEAD --list "$glob" | grep -E "$semver_re" | sort -V | tail -n1 || true)"

          if [ -z "$version" ]; then
            base="$(git describe --tags --abbrev=0 --match "$glob" --exclude '*-*' HEAD 2>/dev/null || true)"
            if [[ "$base" =~ $semver_re ]]; then
              major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
              subjects="$(git log --format=%s "$base..HEAD")"
              bodies="$(git log --format=%b "$base..HEAD")"
              if grep -qiE '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -qE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
                if [ "$major" -eq 0 ]; then version="v0.$((minor + 1)).0"; else version="v$((major + 1)).0.0"; fi
              elif grep -qiE '^feat(\([^)]*\))?:' <<<"$subjects"; then
                version="v$major.$((minor + 1)).0"
              else
                version="v$major.$minor.$((patch + 1))"
              fi
            else
              version="v0.1.0"
            fi
          fi

          if [ -n "$PR_SHA" ]; then
            version="$version-g${PR_SHA:0:7}"
          fi

          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "### Version: \`$version\`" >>"$GITHUB_STEP_SUMMARY"

  # Toolchain image (docker/toolchain.Dockerfile), tagged with the hash of the Dockerfile: pulled
  # from ghcr.io if it exists, otherwise built (~10 minutes) and pushed (not from forks).
  # Toolchain image (docker/toolchain.Dockerfile): built and pushed by toolchain.yml, which new
  # pushes do not cancel. This job waits until the tag of the current Dockerfile exists.
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner=$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")
          image=ghcr.io/$owner/protoc-gen-uni-toolchain:$(sha256sum docker/toolchain.Dockerfile | cut -c1-12)
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          until docker manifest inspect "$image" >/dev/null 2>&1; do
            echo "waiting for $image (workflow toolchain.yml)"
            sleep 60
          done
          echo "$image exists"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: no third-party includes
        run: scripts/check-includes.sh

  build:
    needs: [version, toolchain]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-x86_64, linux-aarch64, windows-x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build (twice, must be byte-identical)
        env:
          IMAGE: ${{ needs.toolchain.outputs.image }}
          PRESET: ${{ matrix.preset }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for dir in build/$PRESET build/$PRESET-again; do
            UNI_TOOLCHAIN_IMAGE=$IMAGE scripts/docker.sh bash -c \
              "cmake --preset $PRESET -B $dir -DUNI_VERSION=$VERSION -DUNI_WERROR=ON && cmake --build $dir"
          done
          bin=protoc-gen-uni; [ "$PRESET" != windows-x86_64 ] || bin=protoc-gen-uni.exe
          cmp "build/$PRESET/$bin" "build/$PRESET-again/$bin"
          # unit tests, registry check and golden tests (aarch64 under qemu; no Wine for Windows)
          if [ "$PRESET" != windows-x86_64 ]; then
            UNI_TOOLCHAIN_IMAGE=$IMAGE scripts/docker.sh ctest --test-dir "build/$PRESET" --output-on-failure
          fi
          mkdir -p out && cp "build/$PRESET/$bin" out/
          ls -l out/ | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.preset }}
          path: out/
          if-no-files-found: error

  build-darwin:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          command -v ninja >/dev/null || brew install ninja
          cmake --preset darwin -B build/darwin-$ARCH -DCMAKE_OSX_ARCHITECTURES=$ARCH -DUNI_VERSION=$VERSION -DUNI_WERROR=ON
          cmake --build build/darwin-$ARCH
          mkdir -p out && cp build/darwin-$ARCH/protoc-gen-uni out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  # E2E golden tests: buf runs the binary as a local plugin on testdata/proto (tests/e2e/all.sh),
  # natively on each platform.
  test-linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {preset: linux-x86_64, runner: ubuntu-latest}
          - {preset: linux-aarch64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.preset }}
          path: out
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/buf
          key: buf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('testdata/proto/*/buf.lock') }}
      - run: chmod +x out/protoc-gen-uni && out/protoc-gen-uni --version && tests/e2e/all.sh out/protoc-gen-uni

  test-darwin:
    needs: build-darwin
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin-arm64
          path: out
      - run: chmod +x out/protoc-gen-uni && tests/e2e/all.sh out/protoc-gen-uni

  test-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x86_64
          path: out
      - run: tests/e2e/all.sh out/protoc-gen-uni.exe

  # Unit and e2e tests under AddressSanitizer + UndefinedBehaviorSanitizer (clang, glibc).
  asan:
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          IMAGE: ${{ needs.toolchain.outputs.image }}
        run: UNI_TOOLCHAIN_IMAGE=$IMAGE scripts/docker.sh cmake --workflow --preset asan

  # Two minutes of libFuzzer (+ASan/UBSan) on fuzz/fuzz_request.c, seeded with the requests of the
  # golden tests (recorded via buf by scripts/fuzz-corpus.sh).
  fuzz:
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          IMAGE: ${{ needs.toolchain.outputs.image }}
        run: |
          UNI_TOOLCHAIN_IMAGE=$IMAGE scripts/docker.sh bash -c '
            set -euo pipefail
            cmake --preset fuzz && cmake --build --preset fuzz
            UNI_FUZZ_MAX_SEED=65536 scripts/fuzz-corpus.sh
            build/fuzz/fuzz/fuzz_request -max_total_time=120 -timeout=10 -rss_limit_mb=2048 -artifact_prefix=build/fuzz/ \
              -dict=fuzz/params.dict build/fuzz/corpus'

  # Image FROM scratch (docker/scratch.Dockerfile) with the tested static Linux binaries, for
  # linux/amd64 and linux/arm64 (there is no scratch base for Windows or macOS). Built on every run;
  # pushed to ghcr.io/<owner>/protoc-gen-uni as <version> and latest on main only.
  docker:
    needs: [version, lint, build, build-darwin, test-linux, test-darwin, test-windows, asan, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: artifacts # one directory per artifact (build preset)
      - env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          owner=$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")
          image=ghcr.io/$owner/protoc-gen-uni
          mkdir -p ctx
          install -m 755 artifacts/linux-x86_64/protoc-gen-uni ctx/protoc-gen-uni-amd64
          install -m 755 artifacts/linux-aarch64/protoc-gen-uni ctx/protoc-gen-uni-arm64
          docker buildx create --use >/dev/null
          args=(--platform linux/amd64,linux/arm64 -f docker/scratch.Dockerfile -t "$image:$VERSION"
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.version=$VERSION")
          if [ "$PUSH" = true ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            args+=(-t "$image:latest" --push)
          fi
          docker buildx build "${args[@]}" ctx
          echo "### Image: \`$image:$VERSION\`$([ "$PUSH" = true ] || echo ' (built, not pushed)')" >>"$GITHUB_STEP_SUMMARY"

  release:
    needs: [version, lint, build, build-darwin, test-linux, test-darwin, test-windows, asan, fuzz, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tag and GitHub Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts # one directory per artifact (build preset)
      - name: collect binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for m in linux-x86_64:linux_amd64 linux-aarch64:linux_arm64 darwin-x86_64:darwin_amd64 \
                   darwin-arm64:darwin_arm64 windows-x86_64:windows_amd64; do
            preset=${m%%:*} target=${m#*:}
            ext=""; [ "${target%%_*}" != windows ] || ext=".exe"
            install -m 755 "artifacts/$preset/protoc-gen-uni$ext" "dist/protoc-gen-uni_${VERSION#v}_${target}${ext}"
          done
          (cd dist && sha256sum -- * >checksums.txt)
          ls -l dist | tee -a "$GITHUB_STEP_SUMMARY"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping."
            exit 0
          fi
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes --latest
          echo "### 🚀 Released \`$VERSION\`" >>"$GITHUB_STEP_SUMMARY"
