# Toolchain image (docker/toolchain.Dockerfile), tagged with the hash of the Dockerfile and pushed to
# ghcr.io/<owner>/protoc-gen-uni-toolchain. Building it compiles the musl cross GCC (~35 minutes),
# so it runs apart from ci.yml: new pushes do not cancel it (one run at a time, never cancelled), and
# a run whose tag already exists ends at once. The `toolchain` job of ci.yml waits for the tag.
name: toolchain

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: toolchain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    # Fork pull requests cannot push to the registry.
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner=$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")
          image=ghcr.io/$owner/protoc-gen-uni-toolchain:$(sha256sum docker/toolchain.Dockerfile | cut -c1-12)
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "$image exists"
            exit 0
          fi
          docker build -t "$image" -f docker/toolchain.Dockerfile docker
          docker push "$image"
          echo "### Built \`$image\`" >>"$GITHUB_STEP_SUMMARY"
