# Golden config for community/neoeinstein-prost v0.5.0: inputs = tests (testdata/proto/<test>),
# one plugin entry = one option group (out: <group>).
# Inputs left out: upstream panics on editions and naming.
# Real-project inputs left out: real-protovalidate-editions (no editions).
# Regenerate: scripts/gen-testdata.sh community/neoeinstein-prost v0.5.0
version: v2
inputs:
  - directory: testdata/proto/proto2
  - directory: testdata/proto/proto3
  - directory: testdata/proto/wkt
  - directory: testdata/proto/services
  - directory: testdata/proto/imports
  - directory: testdata/proto/comments
  - directory: testdata/proto/custom-options
  - directory: testdata/proto/empty
  - directory: testdata/proto/rust-prost
  - directory: testdata/proto/real-googleapis
  - directory: testdata/proto/real-otel
  - directory: testdata/proto/real-protovalidate
plugins:
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: default
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: bsr
    opt: [file_descriptor_set, bytes=., flat_output_dir]
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: config
    opt: [enable_type_names, retain_enum_prefix, btree_map=., compile_well_known_types]
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: attrs
    opt: [extern_path=.test.imports.common.v1=::common, extern_path=.google.protobuf.Timestamp=::time::Ts, disable_comments=.test.comments.Message, disable_comments=Enum.ENUM_ONE, disable_comments=.test.rust.Type.match, boxed=.test.rust.legacy, boxed=.test.rust.Impl.for.y, skip_debug=.test.proto3, skip_debug=.test.rust.Point, "type_attribute=.=// t", "field_attribute=.=// f", "enum_attribute=.test=// e", "message_attribute=.=// m", 'field_attribute=.test.rust.Type.self=// a\, b', default_package_filename=root, bytes=.test.rust.WithString.b, btree_map=.test.rust]
