# Golden config for community/neoeinstein-prost-serde v0.4.0: inputs = tests (testdata/proto/<test>),
# one plugin entry = one option group (out: <group>).
# Every group needs no_include: otherwise it reads the prost output of the same run.
# Inputs left out: imports (a file without package: upstream panics), rust-crate (two packages
# map to one module, so two outputs collide), editions* (upstream panics on the syntax).
# Real-project inputs left out: real-protovalidate-editions (no editions).
# Regenerate: scripts/gen-testdata.sh community/neoeinstein-prost-serde v0.4.0
version: v2
inputs:
  - directory: testdata/proto/proto2
  - directory: testdata/proto/proto3
  - directory: testdata/proto/wkt
  - directory: testdata/proto/services
  - directory: testdata/proto/comments
  - directory: testdata/proto/custom-options
  - directory: testdata/proto/empty
  - directory: testdata/proto/naming
  - directory: testdata/proto/rust-prost
  - directory: testdata/proto/real-googleapis
  - directory: testdata/proto/real-otel
  - directory: testdata/proto/real-protovalidate
plugins:
  - remote: buf.build/community/neoeinstein-prost-serde:v0.4.0
    out: default
    opt: [no_include]
  - remote: buf.build/community/neoeinstein-prost-serde:v0.4.0
    out: options
    opt: [no_include, preserve_proto_field_names, emit_fields, use_integers_for_enums, ignore_unknown_fields, btree_map=.]
  - remote: buf.build/community/neoeinstein-prost-serde:v0.4.0
    out: extern
    opt: [no_include=true, extern_path=.google.protobuf=::pbjson_types, extern_path=.test.rust.Impl=crate::imp, extern_path=.test.rust.Impl.Fn=::fns::Function, extern_path=.test.proto2=::p2, exclude=.test.naming.Naming, exclude=.test.rust.legacy, exclude=.test.proto3.Reserved, flat_output_dir, default_package_filename=root, retain_enum_prefix]
  - remote: buf.build/community/neoeinstein-prost-serde:v0.4.0
    out: btree
    opt: [no_include, ignore_unknown_fields=true, btree_map=.test.rust.Type, btree_map=.test.proto3, retain_enum_prefix=false, preserve_proto_field_names=false, flat_output_dir=false]
