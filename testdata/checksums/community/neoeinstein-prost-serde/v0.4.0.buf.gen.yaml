# Golden config for community/neoeinstein-prost-serde v0.4.0: inputs = tests (testdata/proto/<test>),
# one plugin entry = one option group (out: <group>).
# Inputs left out: needs no_include: otherwise it reads the prost output of the same run.
# Regenerate: scripts/gen-testdata.sh community/neoeinstein-prost-serde v0.4.0
version: v2
inputs:
  - directory: testdata/proto/proto2
  - directory: testdata/proto/proto3
  - directory: testdata/proto/wkt
  - directory: testdata/proto/services
  - directory: testdata/proto/comments
  - directory: testdata/proto/custom-options
  - directory: testdata/proto/empty
plugins:
  - remote: buf.build/community/neoeinstein-prost-serde:v0.4.0
    out: default
    opt: [no_include]
  - remote: buf.build/community/neoeinstein-prost-serde:v0.4.0
    out: options
    opt: [no_include, preserve_proto_field_names, emit_fields, use_integers_for_enums, ignore_unknown_fields, btree_map=.]
