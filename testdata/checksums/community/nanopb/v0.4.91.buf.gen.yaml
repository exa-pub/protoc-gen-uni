# Golden config for community/nanopb v0.4.91: inputs = tests (testdata/proto/<test>),
# one plugin entry = one option group (out: <group>).
# Inputs left out: upstream fails on proto2 (circular dependency) and naming (traceback); no editions support.
# Regenerate: scripts/gen-testdata.sh community/nanopb v0.4.91
version: v2
inputs:
  - directory: testdata/proto/proto3
  - directory: testdata/proto/wkt
  - directory: testdata/proto/services
  - directory: testdata/proto/imports
  - directory: testdata/proto/comments
  - directory: testdata/proto/custom-options
  - directory: testdata/proto/empty
plugins:
  - remote: buf.build/community/nanopb:v0.4.91
    out: default
  - remote: buf.build/community/nanopb:v0.4.91
    out: cstyle
    opt: [-C, --strip-path]
  - remote: buf.build/community/nanopb:v0.4.91
    out: ext
    opt: [--extension=.npb, --header-extension=.hpp, --source-extension=.cpp, --cpp-descriptors]
