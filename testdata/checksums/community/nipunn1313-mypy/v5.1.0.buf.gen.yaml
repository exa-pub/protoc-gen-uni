# Golden config for community/nipunn1313-mypy v5.1.0: inputs = tests (testdata/proto/<test>),
# one plugin entry = one option group (out: <group>).
# Regenerate: scripts/gen-testdata.sh community/nipunn1313-mypy v5.1.0
version: v2
inputs:
  - directory: testdata/proto/proto2
  - directory: testdata/proto/proto3
  - directory: testdata/proto/editions2023
  - directory: testdata/proto/editions2024
  - directory: testdata/proto/wkt
  - directory: testdata/proto/services
  - directory: testdata/proto/imports
  - directory: testdata/proto/comments
  - directory: testdata/proto/naming
  - directory: testdata/proto/custom-options
  - directory: testdata/proto/empty
  - directory: testdata/proto/go-features
  - directory: testdata/proto/python-mypy
  - directory: testdata/proto/real-googleapis
  - directory: testdata/proto/real-otel
  - directory: testdata/proto/real-protovalidate
  - directory: testdata/proto/real-protovalidate-editions
plugins:
  - remote: buf.build/community/nipunn1313-mypy:v5.1.0
    out: default
  - remote: buf.build/community/nipunn1313-mypy:v5.1.0
    out: readable
    opt: [readable_stubs]
  - remote: buf.build/community/nipunn1313-mypy:v5.1.0
    out: relax
    opt: [relax_strict_optional_primitives, quiet]
  - remote: buf.build/community/nipunn1313-mypy:v5.1.0
    out: deprecation
    opt: [use_default_deprecation_warnings]
  - remote: buf.build/community/nipunn1313-mypy:v5.1.0
    out: all
    opt: [readable_stubs, relax_strict_optional_primitives, use_default_deprecation_warnings, generate_concrete_servicer_stubs, only_sync]
