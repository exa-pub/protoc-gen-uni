# Golden config for community/planetscale-vtprotobuf v0.6.0: inputs = tests (testdata/proto/<test>),
# one plugin entry = one option group (out: <group>).
# Editions inputs (editions2023, editions2024, go-features, real-protovalidate-editions): upstream
# (protobuf-go v1.31) rejects them with "invalid syntax", their expected error.
# go-vtproto sets the vtproto.mempool option; wrap=true cannot be combined with the pool feature
# (upstream writes "var vtprotoPool_pkg.T").
# annotate: annotate_code with the grpc feature (the only one that annotates); bad-feature: the
# "unknown feature" error of the response.
# Regenerate: scripts/gen-testdata.sh community/planetscale-vtprotobuf v0.6.0
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: example.com/gen
inputs:
  - directory: testdata/proto/proto2
  - directory: testdata/proto/proto3
  - directory: testdata/proto/wkt
  - directory: testdata/proto/services
  - directory: testdata/proto/services-case
  - directory: testdata/proto/services-naming
  - directory: testdata/proto/services-generic
  - directory: testdata/proto/imports
  - directory: testdata/proto/comments
  - directory: testdata/proto/naming
  - directory: testdata/proto/json-conflicts-proto2
  - directory: testdata/proto/json-conflicts-proto3
  - directory: testdata/proto/custom-options
  - directory: testdata/proto/empty
  - directory: testdata/proto/go-vtproto
  - directory: testdata/proto/real-googleapis
  - directory: testdata/proto/real-otel
  - directory: testdata/proto/real-protovalidate
  - directory: testdata/proto/real-protovalidate-editions
  - directory: testdata/proto/editions2023
  - directory: testdata/proto/editions2024
  - directory: testdata/proto/go-features
plugins:
  - remote: buf.build/community/planetscale-vtprotobuf:v0.6.0
    out: default
    opt: [paths=source_relative]
  - remote: buf.build/community/planetscale-vtprotobuf:v0.6.0
    out: core
    opt: [paths=source_relative, features=marshal+unmarshal+size]
  - remote: buf.build/community/planetscale-vtprotobuf:v0.6.0
    out: strict
    opt: [paths=source_relative, features=marshal_strict+unmarshal_unsafe+size+equal+clone]
  - remote: buf.build/community/planetscale-vtprotobuf:v0.6.0
    out: pool
    opt: [paths=source_relative, features=pool+unmarshal+clone+grpc+size, pool=example.com/gen/proto3.*, pool=example.com/gen/**/v1.*, pool-exclude=example.com/gen/imports/common/v1.*, allow-empty=true, buildTag=vtproto]
  - remote: buf.build/community/planetscale-vtprotobuf:v0.6.0
    out: wrap
    opt: [wrap=true, module=example.com/gen, features=marshal+unmarshal+size+clone+equal+grpc]
  - remote: buf.build/community/planetscale-vtprotobuf:v0.6.0
    out: annotate
    opt: [paths=source_relative, annotate_code=true, features=grpc+size]
  - remote: buf.build/community/planetscale-vtprotobuf:v0.6.0
    out: bad-feature
    opt: [paths=source_relative, features=size+bogus]
