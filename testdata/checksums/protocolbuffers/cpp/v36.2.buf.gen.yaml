# Golden config for protocolbuffers/cpp v36.2: inputs = tests (testdata/proto/<test>),
# one plugin entry = one option group (out: <group>).
# Inputs left out: naming: protoc rejects naming/legacy.proto (enum value name conflict).
# Regenerate: scripts/gen-testdata.sh protocolbuffers/cpp v36.2
version: v2
inputs:
  - directory: testdata/proto/proto2
  - directory: testdata/proto/proto3
  - directory: testdata/proto/editions2023
  - directory: testdata/proto/editions2024
  - directory: testdata/proto/wkt
  - directory: testdata/proto/services
  - directory: testdata/proto/imports
  - directory: testdata/proto/comments
  - directory: testdata/proto/custom-options
  - directory: testdata/proto/empty
  - directory: testdata/proto/go-features
  - directory: testdata/proto/cpp-features
  - directory: testdata/proto/services-generic
  - directory: testdata/proto/es-bootstrap
  - directory: testdata/proto/map-options
  - directory: testdata/proto/real-googleapis
  - directory: testdata/proto/real-otel
  - directory: testdata/proto/real-protovalidate
  - directory: testdata/proto/real-protovalidate-editions
plugins:
  - remote: buf.build/protocolbuffers/cpp:v36.2
    out: default
  - remote: buf.build/protocolbuffers/cpp:v36.2
    out: lite
    opt: [lite]
  - remote: buf.build/protocolbuffers/cpp:v36.2
    out: code-size
    opt: [code_size]
  - remote: buf.build/protocolbuffers/cpp:v36.2
    out: dll-proto-h
    opt: [dllexport_decl=MY_EXPORT, proto_h]
  - remote: buf.build/protocolbuffers/cpp:v36.2
    out: annotate
    opt: [annotate_headers, annotation_pragma_name=pragma_name, annotation_guard_name=GUARD_NAME, annotate_accessor]
  - remote: buf.build/protocolbuffers/cpp:v36.2
    out: listener
    opt: [speed, experimental_strip_nonfunctional_codegen, inject_field_listener_events, forbidden_field_listener_events=serialize+set]
  - remote: buf.build/protocolbuffers/cpp:v36.2
    out: unknown-option
    opt: [no_such_option]
