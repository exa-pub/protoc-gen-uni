edition = "2024";

package test.editions2024.types;

// File-wide visibility override: everything is exported, nested included.
option features.default_symbol_visibility = EXPORT_ALL;
option features.enum_type = CLOSED;

message Shared {
  string value = 1;

  message Nested {
    int32 n = 1;
  }

  enum Mode {
    MODE_FIRST = 1;
    MODE_SECOND = 2;
  }

  Nested nested = 2;
  Mode mode = 3 [default = MODE_SECOND];
}

local message Private {
  Shared shared = 1;
}
