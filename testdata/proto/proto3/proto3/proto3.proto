// Test: proto3 syntax.
//
// Covers all scalar types (singular, `optional`, repeated), maps with every
// legal key kind and scalar/message/enum values, oneofs with scalar, message
// and enum members, packed-by-default and [packed = false] repeated fields,
// custom json_name, deeply nested types, enums with allow_alias, and
// deprecated fields/messages/enums/enum values.
syntax = "proto3";

package test.proto3;

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_INACTIVE = 2;
  STATUS_NEGATIVE = -3;
}

enum Aliased {
  option allow_alias = true;
  ALIASED_UNSPECIFIED = 0;
  ALIASED_STARTED = 1;
  ALIASED_RUNNING = 1;
  ALIASED_STOPPED = 2;
  ALIASED_HALTED = 2 [deprecated = true];
}

enum OldEnum {
  option deprecated = true;
  OLD_ENUM_UNSPECIFIED = 0;
  OLD_ENUM_VALUE = 1;
}

message AllScalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  Status f_enum = 16;
  AllScalars f_message = 17;
}

message Optionals {
  optional double o_double = 1;
  optional float o_float = 2;
  optional int32 o_int32 = 3;
  optional int64 o_int64 = 4;
  optional uint32 o_uint32 = 5;
  optional uint64 o_uint64 = 6;
  optional sint32 o_sint32 = 7;
  optional sint64 o_sint64 = 8;
  optional fixed32 o_fixed32 = 9;
  optional fixed64 o_fixed64 = 10;
  optional sfixed32 o_sfixed32 = 11;
  optional sfixed64 o_sfixed64 = 12;
  optional bool o_bool = 13;
  optional string o_string = 14;
  optional bytes o_bytes = 15;
  optional Status o_enum = 16;
  optional AllScalars o_message = 17;
  // A real oneof declared after the synthetic ones.
  oneof real {
    int32 r_a = 18;
    string r_b = 19;
  }
}

message Repeateds {
  repeated double r_double = 1;
  repeated float r_float = 2;
  repeated int32 r_int32 = 3;
  repeated int64 r_int64 = 4;
  repeated uint32 r_uint32 = 5;
  repeated uint64 r_uint64 = 6;
  repeated sint32 r_sint32 = 7;
  repeated sint64 r_sint64 = 8;
  repeated fixed32 r_fixed32 = 9;
  repeated fixed64 r_fixed64 = 10;
  repeated sfixed32 r_sfixed32 = 11;
  repeated sfixed64 r_sfixed64 = 12;
  repeated bool r_bool = 13;
  repeated string r_string = 14;
  repeated bytes r_bytes = 15;
  repeated Status r_enum = 16;
  repeated AllScalars r_message = 17;
  repeated int32 unpacked_int32 = 18 [packed = false];
  repeated Status unpacked_enum = 19 [packed = false];
  repeated double unpacked_double = 20 [packed = false];
  repeated int32 explicitly_packed = 21 [packed = true];
}

message Maps {
  map<int32, string> int32_string = 1;
  map<int64, bytes> int64_bytes = 2;
  map<uint32, double> uint32_double = 3;
  map<uint64, float> uint64_float = 4;
  map<sint32, bool> sint32_bool = 5;
  map<sint64, int64> sint64_int64 = 6;
  map<fixed32, uint64> fixed32_uint64 = 7;
  map<fixed64, sint32> fixed64_sint32 = 8;
  map<sfixed32, fixed64> sfixed32_fixed64 = 9;
  map<sfixed64, sfixed32> sfixed64_sfixed32 = 10;
  map<bool, string> bool_string = 11;
  map<string, string> string_string = 12;
  map<string, AllScalars> string_message = 13;
  map<string, Status> string_enum = 14;
  map<int32, Maps> int32_self = 15;
  map<string, Nested.Level1.Level2> string_nested = 16 [json_name = "nestedMap"];
}

message Oneofs {
  oneof scalar {
    int32 s_int32 = 1;
    string s_string = 2;
    bytes s_bytes = 3;
    double s_double = 4;
    bool s_bool = 5;
    uint64 s_uint64 = 6;
  }
  oneof composite {
    AllScalars c_message = 10;
    Status c_enum = 11;
    Oneofs c_self = 12;
    Nested.Level1 c_nested = 13;
  }
  // Oneof with a single member and a field after it.
  oneof single {
    string only = 20;
  }
  int32 after_oneofs = 21;
}

message JsonNames {
  int32 plain_field = 1;
  int32 custom = 2 [json_name = "CustomName"];
  string with_snake = 3 [json_name = "snake_case_json"];
  string with_dash = 4 [json_name = "dash-name"];
  repeated int32 list = 5 [json_name = "listOfInts"];
  int32 field_1_number = 6;
  int32 _leading_underscore = 7;
  int32 trailing_underscore_ = 8;
  int32 double__underscore = 9;
  int32 camelCaseAlready = 10;
  int32 ALLCAPS = 11;
}

message Nested {
  message Level1 {
    enum Level1Enum {
      LEVEL1_ENUM_UNSPECIFIED = 0;
      LEVEL1_ENUM_ONE = 1;
    }

    message Level2 {
      message Level3 {
        message Level4 {
          enum Level4Enum {
            LEVEL4_ENUM_UNSPECIFIED = 0;
            LEVEL4_ENUM_DEEP = 1;
          }
          Level4Enum e = 1;
          Nested root = 2;
          Level1Enum l1 = 3;
        }
        Level4 l4 = 1;
        repeated Level4 l4s = 2;
      }
      Level3 l3 = 1;
      map<string, Level3.Level4> l4_map = 2;
    }
    Level2 l2 = 1;
    Level1Enum e = 2;
  }

  Level1 l1 = 1;
  Level1.Level2.Level3.Level4 shortcut = 2;
  Level1.Level2.Level3.Level4.Level4Enum deep_enum = 3;
}

message Deprecations {
  option deprecated = true;

  int32 old_field = 1 [deprecated = true];
  OldEnum old_enum = 2 [deprecated = true];
  optional string old_optional = 3 [deprecated = true];
  repeated int32 old_repeated = 4 [deprecated = true];
  map<string, int32> old_map = 5 [deprecated = true];
  oneof old_oneof {
    int32 old_choice = 6 [deprecated = true];
    string new_choice = 7;
  }
  int32 not_deprecated = 8 [deprecated = false];
}

message Empty {}

message Reserved {
  reserved 2, 15, 9 to 11, 100 to max;
  reserved "foo", "bar";
  string kept = 1;
}
