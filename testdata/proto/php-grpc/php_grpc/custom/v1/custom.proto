// Test: PHP names in gRPC service code, php_namespace.
syntax = "proto3";

package test.php_grpc.custom.v1;

import "php_grpc/list/v1/types.proto";

option php_namespace = "Custom\\Space";

message Item {
  string id = 1;
}

// CustomService is written under the php_namespace directory.
service CustomService {
  rpc Get(Item) returns (test.php_grpc.list.v1.Plain);
  rpc Self(Item) returns (Item);
}
