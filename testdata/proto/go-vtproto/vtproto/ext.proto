// The vtproto options of github.com/planetscale/vtprotobuf v0.6.0 (vtproto/ext.proto, without
// go_package), so that inputs can set the mempool option.
syntax = "proto2";
package vtproto;

import "google/protobuf/descriptor.proto";

option java_package = "com.google.protobuf";
option java_outer_classname = "VTProto";

extend google.protobuf.MessageOptions {
  optional bool mempool = 64101;
}
